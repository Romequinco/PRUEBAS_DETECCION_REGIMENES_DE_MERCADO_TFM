# Distribucion unica del TFM (sistema multi-agente RAG con regimen de mercado). Paquetes en ``src/``:
# ``regimenes`` (Fase 1, regimen -> get_regimen), ``ingesta`` (Fase 2, datos por tema) y
# ``herramientas`` (contrato de tools para los agentes). Las fases 3-5 se anaden como paquetes
# hermanos (ver docs/decisions/ADR-012-estructura-repo.md).
#
# Instalacion de desarrollo (editable), SIEMPRE con el candado de versiones:
#
#     python -m pip install -e ".[todo]" -c constraints.txt
#
# El candado protege la huella de cache del benchmark (versiones de numpy, pandas, scipy,
# scikit-learn, hmmlearn, arch, torch y jumpmodels). ``requirements.txt`` queda como alias de una
# linea (lo cita un mensaje de error de benchmark/ejecucion.py, que entra en la huella).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-aware-macro-equity"
version = "0.5.0"
description = "TFM: sistema multi-agente RAG con regimen de mercado (Fase 1 regimen, Fase 2 ingesta y tools, fases 3-5 agentes, cartera y evaluacion)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Nucleo de datos y calculo
    # Cotas superiores: el benchmark versionado se valido con numpy 2.3 / pandas 2.3.
    # pandas 3 cambia la resolucion por defecto de los indices (us) y el orden de
    # pd.concat. El codigo NO es robusto a lo primero: resolve_context('auto')
    # (evaluacion/walk_forward.py) asume indices datetime64[ns] al calcular el
    # hueco mediano (index.asi8 / 86_400e9); con un indice mensual en 'us' o 's'
    # devuelve 252 en vez de 12 (un indice diario da 252 en cualquier unidad).
    # Sin efecto hoy: data/processed y los paneles son datetime64[ns]. No se corrige
    # alli porque walk_forward.py entra en la huella de la cache del benchmark.
    # Se fija <3 para que una instalacion limpia (CI) reproduzca el entorno.
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11",
    "pyyaml>=6.0",             # configs/catalog.yaml, configs/benchmark_spec.yaml
    "pyarrow>=15.0",           # parquet de data/raw y data/processed
    # Capa de datos (regimenes.datos)
    "yfinance>=0.2.40",
    "requests>=2.31",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pandas-datareader>=0.10",
    # Detectores (regimenes.detectores)
    "scikit-learn>=1.4",       # GMM, PCA (D03, D12)
    "hmmlearn>=0.3",           # HMM gaussiano / init HMM-t (D04, D08)
    "statsmodels>=0.14",       # Markov-Switching (D05)
    "arch>=6.0",               # GJR-GARCH-t (D06)
    # Visualizacion (regimenes.viz)
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Contrato de tools (regimenes ya lo usa en ingesta; herramientas lo exige)
    "pydantic>=2.6",
]

[project.optional-dependencies]
deep = ["torch>=2.1"]                  # D12 autoencoder + GMM (f7_deep)
jump = ["jumpmodels>=0.1"]             # D09 Statistical Jump Model (f2_clustering)
changepoint = ["ruptures>=1.1"]        # oraculo PELT offline citado en D07 (lo importa el notebook 11)
# Fase 2 · un extra por tema (antes requirements/ingesta-<tema>.txt)
ingesta-mercados = [                   # Tema 1 · mercados y series
    "duckdb>=1.1",                     # tests y consultas ad hoc sobre los parquet del corpus
    "pandera>=0.24",                   # contratos de esquema (pandera.pandas)
    "hypothesis>=6.100",               # tests basados en propiedades (TimeGate, catalogo)
    "exchange_calendars>=4.5",         # calendarios de sesiones
]
ingesta-bancos = [                     # Tema 2 · bancos centrales y riesgo
    "beautifulsoup4>=4.12",            # enlaces y fechas de las paginas de los bancos
    "pypdf>=4.0",                      # texto de los PDF
    "tzdata>=2024.1",                  # zonas horarias de zoneinfo en Windows
    "nbclient>=0.10",                  # bancos_riesgo.jobs
]
ingesta-noticias = [                   # Tema 4 · noticias y alternativos (xlrd/openpyxl ya en el nucleo)
    "pypdf>=4.0",                      # texto de los PTR de la Camara
]
# Tema 3 · empresas: sin dependencias extra (biblioteca estandar + nucleo).
ingesta = ["regime-aware-macro-equity[ingesta-mercados,ingesta-bancos,ingesta-noticias]"]
dev = [
    "pytest>=8.0",
    "nbconvert>=7.0",
    "nbformat>=5.9",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ruff>=0.5",
]
todo = ["regime-aware-macro-equity[deep,jump,changepoint,dev,ingesta]"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["regimenes*", "ingesta*", "herramientas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "datos: necesita data/raw o data/processed locales (gitignored); se salta si faltan",
    "resultados: lee results/benchmark versionado (transitorio si un benchmark lo esta reescribiendo)",
    "live: Fase 2 (ingesta), toca la red; se salta salvo INGESTA_LIVE=1",
]

# Ruff: configuracion minima (lint, sin reformateo). Uso: ``ruff check src tests``.
# Solo errores reales (pyflakes F, sintaxis/indentacion E9); no se aplica
# ``ruff format`` para no introducir diffs masivos en el codigo congelado.
[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]
extend-exclude = ["notebooks", "*.ipynb"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401"]  # re-exportaciones de __init__ y alias publicos
