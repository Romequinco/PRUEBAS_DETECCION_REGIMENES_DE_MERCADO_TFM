# bloques.yaml — PRE-REGISTRO del reparto del pool de features en bloques (termómetros).
#
# Un termómetro = 1 columna causal por bloque: PCA del bloque reajustada cada mes solo con el
# pasado (regimenes.features.bloques). Origen: PendientesOscar.md §6.3 (tabla de bloques) y §6.5
# (validación). Este fichero lo congelará el ADR-008; hasta entonces es la PROPUESTA inicial.
#
# Reglas del fichero:
#   - Nombres = columnas EXACTAS de construir_diarias/construir_mensuales (regimenes.features.paneles).
#   - Cada columna del pool de la pista está en un único bloque (B: 77 col en 8 bloques; A: 35 en 5).
#   - ancla = columna del bloque y signo esperado (+1/-1) con el que el termómetro sube con el estrés.
#     Todas las anclas son PROPUESTA, pendiente de aprobación en ADR-008.
#   - CAPE_z puede faltar en una máquina sin SHILLER_SP500_CAPE: construir_termometros la omite y lo
#     reporta en el diagnóstico (columna `ausentes`).
#
# Resoluciones respecto a la tabla de §6.3:
#   - T8 abrevia (INDPRO, PPI x3, CPI x2, ...): nombres resueltos con paneles.MENSUAL_MACRO/MERCADO.
#   - Pista A, T8: la tabla dice "las mismas salvo CFNAI, PMI e ICSA (15)", que da 14. La columna 15
#     es WTI_yoy_z (en A existe y no tiene T7 donde ir); así A suma 7+10+1+2+15 = 35.

meta:
  version: 1
  estado: propuesta_pendiente_ADR008
  generado: '2026-10-30'

reajuste: mensual            # último día del índice de cada mes; cargas aplicadas a (r, r_siguiente]
min_obs: 252                 # filas no-NaN mínimas para que una columna sea elegible en un reajuste
ventana: null                # null = expansiva; entero = rolling de N filas
umbrales_var_a_probar: [0.30, 0.40, 0.50]   # var. explicada mínima de la PC1; por debajo -> media simple

pista_B:
  T1_renta_variable:
    ancla: {columna: SP500_vol_z, signo: 1}            # propuesta, pendiente de aprobación en ADR-008
    columnas: [SP500_ret_z, SP500_vol_z, SP500_momentum, SP500_drawdown, SP500_megacap_gap_z,
               equity_breadth_dispersion_z, smallcap_largecap_spread_z, style_spread_z, FF_MKT_z,
               FF_MOM_z, FF_RMW_z, FF_industry_dispersion_z, sector_dispersion, cyc_def_ratio_z]
  T2_tipos_nivel_curva:
    ancla: {columna: slope_10y3m_z, signo: -1}         # propuesta, pendiente de aprobación en ADR-008 (inversión = estrés)
    columnas: [slope_10y2y_z, slope_10y3m_z, curve_curvature_z, mid_curve_z, curve_vs_policy_10y_z,
               curve_vs_policy_5y_z, short_rate_z, EFFR_z, TB3MS_z, GS1_z, GS5_z, GS10_z,
               term_spread_hist_z, fed_stance_z, corr_spx_bond]
  T3_velocidad_tipos:
    ancla: {columna: DGS10_change_z, signo: 1}         # propuesta, pendiente de aprobación en ADR-008
    columnas: [DGS10_change_z, DFII10_change_z, MOVE_change_z]
  T4_inflacion_tipo_real:
    ancla: {columna: breakeven_10y_z, signo: 1}        # propuesta, pendiente de aprobación en ADR-008
    columnas: [DFII5_z, breakeven_10y_z, breakeven_5y_z, breakeven_5y_fwd_z]
  T5_vol_implicita:
    ancla: {columna: VIX_level_z, signo: 1}            # propuesta, pendiente de aprobación en ADR-008
    columnas: [VIX_level_z, VIX_change_z, MOVE_level_z, VVIX_z, vix_term_z,
               vol_complex_dispersion_z, SKEW_z]
  T6_credito:
    ancla: {columna: credit_BAA10Y_z, signo: 1}        # propuesta, pendiente de aprobación en ADR-008
    columnas: [credit_BAA10Y_z, credit_BaaAaa_diaria_z, credit_BaaAaa_mensual_z, credit_BaaFF_z,
               credit_HYG_IEF_z, credit_HYG_LQD_z]
  T7_divisas_materias_primas:
    ancla: {columna: DXY_change_z, signo: 1}           # propuesta, pendiente de aprobación en ADR-008
    columnas: [DXY_change_z, JPY_ret_z, CHF_ret_z, AUD_ret_z, GOLD_ret_z, GSCI_ret_z, BCOM_ret_z,
               WTI_yoy_z, broad_dollar_real_z, broad_dollar_nominal_z]
  T8_macro_valoracion:
    ancla: {columna: UNRATE_chg_z, signo: 1}           # propuesta, pendiente de aprobación en ADR-008
    columnas: [INDPRO_yoy_z, PPI_yoy_z, PPI_fuels_yoy_z, PPI_metals_yoy_z, CPI_yoy_z, CPI_core_yoy_z,
               UNRATE_chg_z, PAYEMS_chg_z, CFNAI_z, CFNAIMA3_z, PMI_proxy_z, ICSA_z, UMCSENT_z,
               HOUST_yoy_z, MANEMP_yoy_z, GDP_growth_z, CAPE_z, GW_valuation_z]

pista_A:
  T1_renta_variable:
    ancla: {columna: SP500_vol_z, signo: 1}            # propuesta, pendiente de aprobación en ADR-008
    columnas: [SP500_ret_z, SP500_vol_z, SP500_momentum, SP500_drawdown, FF_MKT_z, FF_MOM_z,
               FF_industry_dispersion_z]
  T2_tipos_nivel_curva:
    ancla: {columna: term_spread_hist_z, signo: -1}    # propuesta, pendiente de aprobación en ADR-008 (slope_10y3m_z no existe en A)
    columnas: [mid_curve_z, curve_vs_policy_10y_z, curve_vs_policy_5y_z, short_rate_z, TB3MS_z,
               GS1_z, GS5_z, GS10_z, term_spread_hist_z, fed_stance_z]
  T3_velocidad_tipos:
    ancla: {columna: DGS10_change_z, signo: 1}         # propuesta, pendiente de aprobación en ADR-008
    columnas: [DGS10_change_z]
  T6_credito:
    ancla: {columna: credit_BaaAaa_mensual_z, signo: 1}  # propuesta, pendiente de aprobación en ADR-008 (credit_BAA10Y_z no existe en A)
    columnas: [credit_BaaAaa_mensual_z, credit_BaaFF_z]
  T8_macro_valoracion:
    ancla: {columna: UNRATE_chg_z, signo: 1}           # propuesta, pendiente de aprobación en ADR-008
    columnas: [INDPRO_yoy_z, PPI_yoy_z, PPI_fuels_yoy_z, PPI_metals_yoy_z, CPI_yoy_z, CPI_core_yoy_z,
               UNRATE_chg_z, PAYEMS_chg_z, UMCSENT_z, HOUST_yoy_z, MANEMP_yoy_z, GDP_growth_z,
               WTI_yoy_z, CAPE_z, GW_valuation_z]
