      - "Horas históricas (cierre, 2026-10-13): el archivo de federalreserve.gov/releases/h15/ solo guarda la edición semanal (lunes: 1997-01-06, 2005-01-03 'For immediate release'; martes 2012-01-03 tras festivo) y da 404 en los demás días (1997-01-07, 2001-01-09, 2005-01-04, 2012-01-04). La actualización diaria de la web no está archivada: la regla diaria antes de 2005-06-28 sigue sin verificar (deuda; son cotizaciones de mercado públicas el mismo día)"

