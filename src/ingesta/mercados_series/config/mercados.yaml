# Mercados del Tema 1: hora de cierre LOCAL de la sesión, con vigencias.
#
# Un cierre es visible a la hora de cierre + MARGEN_CIERRE (30 min, visibilidad.py) y su
# fecha_publicacion es la primera decisión (16:30 America/New_York) posterior o igual.
#
# Estructura (una entrada por mercado; clave = código MIC o convención propia: CME, CRYPTO...):
#   nombre:     nombre legible
#   huso:       huso IANA (zoneinfo); el DST lo pone el huso, no se escribe a mano
#   cierres:    tramos sin solapes ni huecos, ordenados por 'desde'
#               - desde: "AAAA-MM-DD"   (incluido)
#                 hasta: "AAAA-MM-DD" | null  (incluido; null = vigente)
#                 hora:  "HH:MM"  (24:00 = fin del día local, p. ej. velas diarias UTC)
#   fuente:     URL o documento que respalda las horas
#   verificado: true solo si se ha contrastado con la fuente oficial
#   notas:      (opcional) lista de aclaraciones
#
# Convenciones:
# - Las horas van SIEMPRE entre comillas: YAML 1.1 lee 16:00 sin comillas como el entero 960.
# - El primer tramo empieza en 1900-01-01 por convención: cubre todo el histórico con la hora
#   indicada. Donde el cierre histórico fue ANTERIOR (p. ej. NYSE a las 15:30 hasta 1974) la hora
#   actual es más tardía, luego conservadora. Solo se abren tramos para cambios documentados.
# - Días de cierre anticipado: se usa el cierre ordinario (más tarde que el real: conservador).
# - Subastas de cierre con final aleatorio (Xetra, Euronext, LSE, ASX...): se declara el inicio
#   de la subasta; el margen de 30 min cubre el final aleatorio (unos minutos).
# - Nada de esto está contrastado aún con la fuente oficial: verificado: false en todos.

