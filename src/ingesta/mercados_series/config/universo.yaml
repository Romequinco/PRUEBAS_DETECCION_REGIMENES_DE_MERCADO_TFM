# Universo de instrumentos del Tema 1 (bloque 5). Lo carga y valida universo.cargar_universo().
#
# Estructura: 'grupos' con 'defaults' (campos comunes) e 'instrumentos'; cada instrumento hereda
# los defaults de su grupo y puede sobrescribirlos. Campos de cada instrumento:
#   id:                      id canónico con prefijo de fuente ('yf:SPY', 'coinbase:BTC-USD')
#   nombre:                  nombre legible
#   clase:                   etf | etp | indice | volatilidad | divisa | futuro | cripto | fondo
#   bucket:                  agrupación económica (rv_eeuu, rv_europa, rf_gobierno_eeuu, oro...)
#   capa:                    estrategica | tactica | contexto | baseline
#   invertible_minorista_ue: true si un minorista de la UE puede comprarlo (UCITS o ETP con KID
#                            PRIIPs; cripto al contado). Los ETF domiciliados en EE. UU. no
#                            publican KID: false (se usan como señal y referencia, no se invierten)
#   tickers:                 {proveedor: ticker}; si el id es 'yf:X' y falta 'yahoo', se deduce
#   isin:                    ISIN o null (índices, futuros, divisas, cripto). Validado con su dígito de
#                            control; en los ETF de EE. UU. no se contrasta con el emisor (son señal,
#                            no se invierten): null donde el dígito de control fallaba
#   mercado:                 clave de mercados.yaml (o de config/fragmentos/b5_universo.yaml)
#   divisa:                  ISO 4217 o subunidad (GBp, ZAc, ILA, USX: centésimas), la de la línea cotizada
#   indice_referencia:       índice que replica o null
#   inicio_esperado:         primera cotización esperada (AAAA-MM-DD) o null; en los UCITS, la
#                            fecha de lanzamiento VERIFICADA en justETF (mediciones en la ficha
#                            'universo'); null + nota si no se pudo verificar
#   equivalente_ucits:       id del UCITS equivalente (solo en los de EE. UU.)
#   proxy_previo:            id con el que se empalma la historia anterior a inicio_esperado
#   fondo_indexado_equivalente: fondo indexado UCITS de referencia (texto, sin verificar salvo nota)
#   estado:                  activo | proxy | por_verificar | inactivo
#   notas:                   lista de aclaraciones
#
# Divisa base USD: se guarda la original y se convierte al leer (divisas.SERIE_FX, BCE en fecha).
# Precios AS-TRADED (ver el adaptador de yfinance): nunca Adj Close.
version: 1

fondos_por_que_no_entran: >-
  Los fondos de inversión indexados (Vanguard, iShares, Fidelity, Amundi...) no entran en la
  optimización: (1) solo publican un valor liquidativo diario calculado después del cierre y
  difundido horas más tarde (visible en t+1), sin precio intradía ni spread observable; (2) las
  órdenes se ejecutan a un NAV desconocido en el momento de decidir (forward pricing), lo que rompe
  la regla de decidir a las 16:30 NY con información visible; (3) su historia en Yahoo es corta,
  incompleta o inexistente para las clases en EUR, y no hay series de NAV point-in-time gratuitas;
  (4) replican los mismos índices que los ETF UCITS del universo, que sí cotizan y tienen coste
  observable (DEGIRO/IBKR). Se anotan como 'fondo_indexado_equivalente' a título informativo
  (alternativa de implementación para el usuario final) y VBMFX solo como proxy previo de AGG.

notas_generales:
  - "Supervivencia: el universo es el de HOY (ETF vivos); la ausencia de ETF cerrados se declara y se mide (WRDS pendiente de MIAX)"
  - "Futuros: solo contexto (vela de Yahoo del contrato continuo, sin roll documentado); no se invierten"
  - "Cripto: Coinbase (USD) principal y Binance Vision de control; vela diaria UTC visible en D+1"
  - "Índices: precio (sin dividendos) salvo nota; solo señal y contexto, no invertibles"

