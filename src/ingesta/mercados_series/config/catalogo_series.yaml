  # --- Empalme del PIB real de EE. UU. por vintage (base.empalmar_pib_real_usa) ---
  deriv:PIB_REAL_USA_VINTAGES:
    alias: [PIB_REAL_USA]
    nombre: PIB real de EE. UU. por vintage, empalme RTDSM (PNB real hasta 1991-11) y ALFRED (PIB real desde 1991-12)
    fuente: calculo_propio
    id_origen: 'philly:ROUTPUT + fred:GDPC1'
    frecuencia: trimestral
    unidad: miles de millones de dólares constantes (base del vintage), tasa anual desestacionalizada
    divisa: USD
    metodo: vintage_exacto
    publicador: philly_rtdsm
    revisable: true
    rol_fase1: null
    licencia: 'Fed de Filadelfia (RTDSM) y FRED/ALFRED: uso libre citando la fuente'
    estado: activa
    verificado: false
    grupo: pib
    agentes:
    - macro
    unidad_por_vintage: true
    coherente_con:
    - fred:GDPC1
    - philly:ROUTPUT
    notas:
    - 'empalme por vintage (base.empalmar_pib_real_usa): RTDSM antes del primer vintage de ALFRED de fred:GDPC1 (1991-12-04)
      y ALFRED desde él; cada fila dice su tramo (PNB real o PIB real) en la nota'
    - 'nivel en dólares constantes de la base de cada vintage y concepto distinto (PNB/PIB) a cada lado del corte: comparar
      tasas de crecimiento dentro de un mismo vintage, no niveles entre vintages'
