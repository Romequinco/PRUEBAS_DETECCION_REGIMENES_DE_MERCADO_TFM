# Catálogo de series del Tema 1 (bloque 2): UNA entrada por serie de la base. Única fuente de verdad
# de las series del tema; visibilidad.cargar_publicaciones fusiona su parte de publicación con
# publicaciones.yaml y la valida con las mismas reglas (ingesta.mercados_series.catalogo).
#
# Origen: las 197 columnas de data/raw (Fase 1, solo lectura) — 3 columnas «alias» de Ken French y
# 2 copias con el mismo id de fuente (VIX_VALIDATION_REF, SP500_DAILY_DRAWDOWN_SRC) se declaran como
# alias —, más los sustitutos y componentes que descarga el extractor de FRED y las series derivadas.
# This product uses the FRED® API but is not endorsed or certified by the Federal Reserve Bank of St. Louis.
#
# Campos (obligatorios):
#   alias        nombre(s) interno(s) de la Fase 1 (texto, lista o null); resuelven al id
#   nombre       nombre legible
#   fuente       id de la ficha de fuente (fred_alfred, yfinance, ken_french, goyal_welch, shiller,
#                datahub, ofr_fsi, calculo_propio); va en la columna 'fuente' de la base
#   id_origen    id o ticker en la fuente (fred:/yf: => id = prefijo:id_origen)
#   frecuencia   diaria | semanal | mensual | trimestral | anual (la real medida, no la de provenance)
#   unidad       unidad exacta del valor ('% anual' en FRED; 'tanto por uno' en Goyal-Welch...)
#   divisa       ISO de la divisa del valor o null si no es monetaria (convenio del BCE: en un tipo
#                de cambio, la divisa cotizada: DEXJPUS 'JPY por 1 USD' -> JPY; DEXUSAL -> USD)
#   metodo       vintage_exacto | calendario | lag_fijo | cierre_mercado | derivada | fichero
#                + publicador (calendario, vintage_exacto) | mercado (cierre_mercado)
#                | lag_clave (lag_fijo, fichero: clave de config/lags.yaml) | componentes (derivada)
#   revisable    true si la fuente revisa valores publicados: vintage_exacto, o lag_fijo/fichero con
#                la nota obligatoria «valores del último vintage: posible fuga de revisiones (ALFRED en el bloque 3)»
#   rol_fase1    spine | core | enricher | fallback | validation | null (provenance.json)
#   licencia     términos; 'copyright <titular>' para ICE, S&P, Moody's, Cboe...; FRED: solo local
#   estado       activa | retirada (la fuente dejó de publicarla) | capada (historia recortada por
#                la fuente) | excluida_ajustada (ETF con auto_adjust=True: fuera de la base, a
#                get_precios) | pendiente_alfred (se cargará con vintages de ALFRED) | duplicada
#                (copia de otra serie con otro id: duplicado_de)
#   verificado   true solo si lo esencial (publicación y metadatos) se ha medido o contrastado
# Campos opcionales: fichero_fase1 ('<carpeta>/<fichero>.parquet:<columna>' en data/raw, texto o
#   lista), fase1_utilizable (false si el parquet de data/raw está corrupto), sucesor, duplicado_de,
#   notas (huecos medidos, descarga, incidencias).
# Reglas de carga desde data/raw: series yfinance -> descartar la barra con fecha >= día de
#   descarga (mtime del parquet en NY; la descarga de 2026-07-20 fue a las 15:37 NY, intradía).
#   Huecos permanentes -> fila con valor nulo y nota. Revisables -> vintage 'unico' + nota obligatoria.

