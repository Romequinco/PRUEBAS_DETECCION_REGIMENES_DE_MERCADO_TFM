# Lags de publicación del Tema 1 (bloque 2) para los métodos lag_fijo y fichero del catálogo.
#
# 1) 'lag_publicacion_fase1': copia CONGELADA (2026-10-12) de LAG_PUBLICACION de la Fase 1
#    (src/regimenes/features/lags.py, commit 6012f03, ADR-003: lags de publicación por serie).
#    Se copian TODAS sus entradas con su texto 'fuente', 'meses', 'dias' y 'tipo' tal cual; no se
#    actualiza si cambia la Fase 1 (tests/ingesta/mercados_series/test_t1_catalogo.py avisa).
# 2) 'adicionales': series no diarias de data/raw que LAG_PUBLICACION no cubre (y reglas de
#    fichero de los académicos), con su justificación conservadora y verificado: false.
#
# Semántica (¡distinta en cada bloque!):
#   meses/dias (solo Fase 1): desplazamiento desde el DÍA 1 del periodo de referencia (mes o
#     trimestre) o desde la fecha de la fuente (semanales: sábado/viernes de fin de semana):
#     visible = inicio + DateOffset(months=meses, days=dias).
#   lag (todas): retraso desde el FIN del periodo, el mismo campo 'lag' de publicaciones.yaml:
#     fin = último día natural del periodo indicado en 'fin_periodo' que contiene la
#           fecha_referencia (mes | trimestre | anio), o la propia fecha (fecha);
#     "nM" = n fines de mes después de 'fin' (pd.offsets.MonthEnd(n)); "nD" = n días naturales;
#     "nMmD" = primero los n fines de mes y después los m días.
#     fecha_publicacion = fin + lag (fecha de decisión desde la que el dato es visible;
#     disponible_utc nulo: solo se conoce el día).
#   Conversión exacta: inicio + k meses + d días = fin + (k - meses_del_periodo) M + (1 + d) D
#     (meses_del_periodo: 1 mensual, 3 trimestral). Ejemplos: k=1 → "1D"; k=2 → "1M1D";
#     WTI (k=1, d=10) → "11D"; PIB trimestral (k=4) → "1M1D"; semanales (k=0, d) → "<d>D".
#     Lo comprueba un test contra LAG_PUBLICACION para todas las entradas.
#   habiles (opcional: semana | us_federal): la fecha se lleva al primer hábil >= ella.
#   n_habiles (opcional, con habiles): nunca antes del n-ésimo hábil tras el fin del periodo.
#   correccion: por qué el bloque 2 añade habiles/n_habiles a una entrada (el lag no cambia).
#   (catalogo.fecha_publicacion_regla aplica lag + habiles + n_habiles.)
# Excepciones medidas: config/excepciones_publicacion.csv (python -m ingesta.mercados_series
#   excepciones-alfred) guarda, por serie y periodo, la primera vintage de ALFRED (output_type=4)
#   cuando es POSTERIOR a la regla (cierres del Gobierno de 1995-96, 2013, 2018-19 y 2025; Moody's
#   fuera de FRED de oct-2016 a mar-2017; medias de H.15 de 1997-2016...). La base usa
#   fecha_publicacion = max(regla, excepción) (catalogo.aplicar_excepciones). Hay que regenerarla si
#   cambian las reglas o llegan periodos nuevos. Antes de la primera vintage de cada serie en ALFRED
#   no hay medición: la regla puede adelantar la publicación real en los periodos anómalos.
# Aviso medido (bloque 2): las medias mensuales de H.15 publicaban con la edición semanal hasta 2016
# (ALFRED: 259 de 354 meses con fuga de 1 a 13 días en GS10, GS5, GS1, TB3MS y FEDFUNDS; 272 de 354
# en BAA y AAA): corregido por periodo con las excepciones desde 1997 y con habiles: us_federal.

version: 1
